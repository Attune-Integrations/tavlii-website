<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tavlii POS — All-in-One Point of Sale for Retail & Restaurants</title>
  <meta name="description" content="Tavlii POS is the all-in-one, cloud-based Point of Sale system built for retail and restaurants. Powerful software meets sleek hardware. Book a demo today." />
  <link rel="icon" type="image/png" href="%BASE_URL%favicon.png">
  <script>
    (function () {
      var stored = localStorage.getItem('tavlii-theme');
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
